---
# Local: `nix develop -c pre-commit install` once, then hooks run on every commit.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: cbcdc463be5464e25e3e955a511599a67b9b987f  # frozen: v0.50.0
    hooks:
      - id: markdownlint

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  # actionlint-py ships the prebuilt binary, so CI doesn't compile Go in its 1Gi job pod.
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: 805f85e558841bf4d852335e036b33d2b26be1cc  # frozen: v1.7.12.25
    hooks:
      # Gitea workflows live in .gitea/, which actionlint doesn't scan on its own.
      - id: actionlint
        files: ^\.gitea/workflows/
        args: [-config-file, .gitea/actionlint.yaml]

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 5d28ad76689820e37135aae979858e64c705d31b  # frozen: 44.188.2
    hooks:
      - id: renovate-config-validator
        args: [--strict]

  - repo: local
    hooks:
      - id: tofu-fmt
        name: tofu fmt
        entry: tofu fmt
        language: system
        files: \.(tf|tftest\.hcl)$
